services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8080
      # - SITE_PASSWORD=change-me
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile
      - caddy_data:/data
volumes:
  caddy_data:
